[project]
name = "delivery-backend"
version = "0.1.0"
description = "FastAPI backend for Delivery Investigation System"
readme = "README.md"
authors = [
    { name = "Nidhi Gupta", email = "nidhig2203@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
